name: Subir zip temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Descargar zip del release temporal
        run: |
          curl -L -o grub-luna-launcher1.zip "https://github.com/lunagave/grub-luna/releases/download/temp-zip-transfer/grub-luna-launcher1.zip"
          ls -l grub-luna-launcher1.zip
          echo "ae8398d2c09721e36d2d06680be148df41488e485df86ce0ef4b7e3c96e162a2  grub-luna-launcher1.zip" | sha256sum -c -
      - name: Confirmar zip en main
        run: |
          git config user.name "lunagave"
          git config user.email "lunagave@users.noreply.github.com"
          git add grub-luna-launcher1.zip
          git commit -m "grub-luna v1.0 - instalador final con imagenes adentro"
          git push origin main
