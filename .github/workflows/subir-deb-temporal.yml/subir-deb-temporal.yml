name: Subir deb temporal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Descargar deb del release temporal
        run: |
          curl -L -o grub-luna_1.0_all.deb "https://github.com/lunagave/grub-luna/releases/download/temp-deb-transfer/grub-luna_1.0_all.deb"
          ls -lh grub-luna_1.0_all.deb
          test "$(stat -c%s grub-luna_1.0_all.deb)" = "28679446"
          echo "971ce3a59d266c1b6ae38a5107dac39b27eebf50dd74299e690102a881f7bcfa  grub-luna_1.0_all.deb" | sha256sum -c -
          file grub-luna_1.0_all.deb
          dpkg-deb --info grub-luna_1.0_all.deb || true
          dpkg-deb --contents grub-luna_1.0_all.deb | head -n 100
      - name: Confirmar deb en main
        run: |
          git config user.name "lunagave"
          git config user.email "lunagave@users.noreply.github.com"
          git add grub-luna_1.0_all.deb
          git commit -m "grub-luna v1.0 - .deb final con imagenes adentro"
          git push origin main
